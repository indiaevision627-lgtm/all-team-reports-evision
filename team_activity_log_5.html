<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Activity Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2333;--ink-soft:#333B52;--paper:#FAFAF7;--paper-dim:#F1EEE4;--border:#E1DDD0;
    --amber:#D98E04;--amber-deep:#B87500;--teal:#1F8A70;--rust:#C1502E;--plum:#6B4C9A;--muted:#6B7280;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:230px;background:var(--ink);color:#EDEBE3;padding:28px 20px;flex-shrink:0;display:flex;flex-direction:column;gap:26px;}
  .brand{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;}
  .brand span{color:var(--amber);}
  .brand small{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9AA1B5;font-weight:400;margin-top:4px;letter-spacing:0.03em;}
  .role-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:5px;letter-spacing:0.04em;margin-top:8px;}
  .role-admin{background:#3A2E52;color:#D9C4FF;}
  .role-emp{background:#2A3149;color:#9AC8FF;}
  .nav{display:flex;flex-direction:column;gap:4px;}
  .nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:500;color:#C9CDDC;transition:background .15s, color .15s;}
  .nav button:hover{background:#2A3149;color:#fff;}
  .nav button.active{background:#2A3149;color:#fff;box-shadow:inset 3px 0 0 var(--amber);}
  .whoami{margin-top:auto;padding-top:18px;border-top:1px solid #333B52;font-size:12.5px;color:#9AA1B5;}
  .whoami b{color:#EDEBE3;display:block;font-size:13.5px;margin-bottom:2px;font-family:'IBM Plex Mono',monospace;}
  .switch-link{all:unset;cursor:pointer;color:var(--amber);font-size:12px;margin-top:8px;display:inline-block;}
  .switch-link:hover{text-decoration:underline;}
  .main{flex:1;padding:40px 44px;max-width:1080px;}
  .page-title{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
  .page-sub{color:var(--muted);font-size:14.5px;margin:0 0 28px;}
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;background:radial-gradient(circle at 15% 20%, rgba(217,142,4,0.07), transparent 40%), var(--paper);padding:20px;}
  .login-card{width:390px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:36px 32px;box-shadow:0 20px 50px -20px rgba(28,35,51,0.25);}
  .login-logo{height:44px;margin-bottom:18px;display:block;}
  .sidebar-logo-row{display:flex;align-items:center;margin-bottom:2px;}
  .sidebar-logo{height:30px;margin-right:10px;}
  .login-card h1{font-family:'Space Grotesk',sans-serif;font-size:21px;margin:0 0 6px;letter-spacing:-0.01em;}
  .login-card p{color:var(--muted);font-size:13.5px;margin:0 0 22px;line-height:1.5;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;text-transform:uppercase;letter-spacing:0.04em;}
  input[type=text], input[type=password], input[type=number], select, textarea{
    width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;font-family:'Inter',sans-serif;font-size:14.5px;color:var(--ink);background:#fff;margin-bottom:16px;transition:border-color .15s;
  }
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--amber);}
  textarea{resize:vertical;min-height:70px;}
  .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--amber);color:#1C1400;font-weight:700;font-size:14.5px;padding:12px 20px;border-radius:9px;transition:background .15s, transform .1s;width:100%;}
  .btn:hover{background:var(--amber-deep);}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.6;cursor:default;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:26px 28px;margin-bottom:24px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .status-pills{display:flex;gap:8px;margin-bottom:16px;}
  .pill{all:unset;cursor:pointer;padding:9px 14px;border-radius:20px;font-size:13px;font-weight:600;border:1.5px solid var(--border);color:var(--muted);}
  .pill.sel-progress{background:#FFF4DE;border-color:var(--amber);color:var(--amber-deep);}
  .pill.sel-done{background:#E7F5F0;border-color:var(--teal);color:var(--teal);}
  .pill.sel-pending{background:#FBE9E3;border-color:var(--rust);color:var(--rust);}
  .pill.sel-leave{background:#EDE7F7;border-color:var(--plum);color:var(--plum);}
  .badge-leave{background:#EDE7F7;color:var(--plum);}
  .search-box{margin-bottom:16px;}
  .search-box input{margin-bottom:0;max-width:320px;}
  .missing-card{background:#FBE9E3;border:1px solid var(--rust);border-radius:12px;padding:16px 20px;margin-bottom:22px;}
  .missing-card b{color:var(--rust);display:block;font-size:13.5px;margin-bottom:8px;}
  .missing-chip{display:inline-block;background:#fff;border:1px solid var(--rust);color:var(--rust);font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:20px;margin:0 6px 6px 0;}
  .proof-link{color:var(--amber-deep);font-size:12px;font-weight:600;text-decoration:none;display:inline-block;margin-top:4px;}
  .proof-link:hover{text-decoration:underline;}
  .export-btn{all:unset;cursor:pointer;background:var(--teal);color:#fff;font-weight:700;font-size:13.5px;padding:10px 18px;border-radius:9px;margin-bottom:16px;display:inline-block;}
  .export-btn:hover{opacity:0.9;}
  .chart-block{margin-bottom:28px;}
  .chart-block h4{font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0 0 14px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-label{width:150px;font-size:13px;font-weight:600;color:var(--ink-soft);flex-shrink:0;text-align:right;}
  .bar-track{flex:1;background:var(--paper-dim);border-radius:6px;height:22px;position:relative;overflow:hidden;}
  .bar-fill{height:100%;background:var(--amber);border-radius:6px;display:flex;align-items:center;}
  .bar-value{font-size:11.5px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink);margin-left:8px;white-space:nowrap;}

  .toast{background:#E7F5F0;border:1px solid var(--teal);color:#146854;padding:11px 16px;border-radius:9px;font-size:13.5px;margin-bottom:18px;display:flex;align-items:center;gap:8px;font-weight:500;}
  .dept-badge{display:inline-flex;align-items:center;gap:6px;background:var(--paper-dim);border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:18px;}
  .filters{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .filters select, .filters input{margin-bottom:0;width:auto;min-width:150px;}
  .stat-row{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .stat-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 20px;min-width:120px;}
  .stat-box .n{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;}
  .stat-box .l{font-size:12px;color:var(--muted);margin-top:2px;}
  .table-wrap{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);font-weight:600;padding:14px 16px;background:var(--paper-dim);border-bottom:1px solid var(--border);}
  tbody td{padding:15px 16px;font-size:14px;border-bottom:1px solid var(--border);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FDFCF9;}
  .emp-cell b{display:block;font-size:14px;}
  .emp-cell span{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);}
  .dept-chip{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:#EDE7F7;color:var(--plum);}
  .date-stamp{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--paper-dim);border:1px dashed #C9C4B2;border-radius:6px;padding:4px 8px;transform:rotate(-1.5deg);color:var(--ink-soft);font-weight:600;}
  .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;}
  .badge-progress{background:#FFF4DE;color:var(--amber-deep);}
  .badge-done{background:#E7F5F0;color:var(--teal);}
  .badge-pending{background:#FBE9E3;color:var(--rust);}
  .time-cell{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state .glyph{font-size:32px;margin-bottom:10px;}
  .loading{padding:40px;text-align:center;color:var(--muted);font-size:14px;}
  .del-btn{all:unset;cursor:pointer;color:var(--rust);font-size:12.5px;font-weight:600;}
  .del-btn:hover{text-decoration:underline;}
  .err{color:var(--rust);font-size:12.5px;margin:-10px 0 14px;}
  .chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 160px);background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .chat-messages{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:12px;}
  .chat-bubble{max-width:65%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4;}
  .chat-bubble.mine{align-self:flex-end;background:var(--amber);color:#1C1400;border-bottom-right-radius:4px;}
  .chat-bubble.other{align-self:flex-start;background:var(--paper-dim);color:var(--ink);border-bottom-left-radius:4px;}
  .chat-meta{font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600;}
  .chat-bubble.mine .chat-meta{color:#6B4E00;text-align:right;}
  .chat-input-row{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border);background:var(--paper-dim);}
  .chat-input-row input{margin-bottom:0;flex:1;}
  .chat-send{all:unset;cursor:pointer;background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:11px 20px;border-radius:9px;}
  .chat-send:hover{background:var(--ink-soft);}
  .chat-empty{margin:auto;color:var(--muted);text-align:center;font-size:14px;}
  .clock-box{background:#2A3149;border-radius:10px;padding:12px 14px;margin-top:4px;}
  .clock-time{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:#EDEBE3;letter-spacing:0.02em;}
  .clock-date{font-size:11.5px;color:#9AA1B5;margin-top:2px;}

  .cal-wrap{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px 24px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .cal-head h3{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:0;}
  .cal-nav{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;font-weight:600;color:var(--ink-soft);}
  .cal-nav:hover{background:var(--paper-dim);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding-bottom:6px;}
  .cal-cell{aspect-ratio:1;border-radius:9px;border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;position:relative;}
  .cal-cell.empty{border:none;}
  .cal-cell.today{border-color:var(--amber);border-width:2px;}
  .cal-cell.done{background:#E7F5F0;border-color:var(--teal);}
  .cal-cell .cal-daynum{font-weight:600;}
  .cal-cell .cal-badge{font-size:9.5px;font-family:'IBM Plex Mono',monospace;color:var(--teal);font-weight:700;margin-top:1px;}
  .cal-legend{display:flex;gap:18px;margin-top:16px;font-size:12px;color:var(--muted);align-items:center;}
  .cal-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--teal);}


  @media (max-width:720px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;padding:16px 20px;gap:16px;}
    .nav{flex-direction:row;}
    .whoami{display:none;}
    .main{padding:24px 18px;}
    .row2, .row3{grid-template-columns:1fr;}
    .table-wrap{overflow-x:auto;}
    table{min-width:640px;}
  }
</style>
</head>

    if(box && box.style.display === 'none'){

      box.innerHTML = '<h2>Page load nahi ho paayi</h2><p>Kuch script load nahi ho saka. Internet connection check karein aur page reload karein.</p><p style="font-family:monospace;font-size:12px;color:#888;">' + (e.message || '') + '</p>';
    }
  });
</script>

function todayStr(){ return new Date().toISOString().slice(0,10); }
function prettyDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short'});
}
function isAdminRole(role){ return role === 'admin' || role === 'owner'; }

function LoginScreen({onLogin}){
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [checking, setChecking] = useState(false);

  async function handleSubmit(e){
    e.preventDefault();
    if(!username.trim() || !password){ setError('Username aur Password dono bharein.'); return; }
    setChecking(true);
    setError('');
    const {data, error: qErr} = await sb.from('activity_log_members').select('*')
      .eq('username', username.trim()).eq('password', password).maybeSingle();
    setChecking(false);
    if(qErr || !data){ setError('Galat username ya password.'); return; }
    onLogin({id: data.id, name: data.name, username: data.username, role: data.role, department: data.department});
  }

  return (
    <div className="login-wrap">
      <div className="login-card">
        <img src={LOGO_URI} className="login-logo" alt="EVISION" />
        <h1>Team Activity Log</h1>
        <p>Apna username aur password daalein.</p>
        <form onSubmit={handleSubmit}>
          <label>Username</label>
          <input type="text" value={username} onChange={e=>setUsername(e.target.value)} />
          <label>Password</label>
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)} />
          {error && <div className="err">{error}</div>}
          <button className="btn" type="submit" disabled={checking}>{checking ? 'Check ho raha hai...' : 'Login Karein'}</button>
        </form>
      </div>
    </div>
  );
}

function SubmitReport({identity, onSaved}){
  const [task, setTask] = useState('');
  const [time, setTime] = useState('');
  const [status, setStatus] = useState('progress');
  const [notes, setNotes] = useState('');
  const [file, setFile] = useState(null);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState('');

  const isLeave = status === 'leave';

  async function handleSubmit(e){
    e.preventDefault();
    if(!isLeave && !task.trim()){ setError('Kripya batayein aaj kya kaam kiya.'); return; }
    setError('');
    setSaving(true);

    let proof_url = null;
    if(file){
      const path = identity.id + '/' + todayStr() + '-' + Date.now() + '-' + file.name;
      const {error: upErr} = await sb.storage.from('report-proofs').upload(path, file);
      if(!upErr){
        const {data: pub} = sb.storage.from('report-proofs').getPublicUrl(path);
        proof_url = pub ? pub.publicUrl : null;
      }
    }

    const entry = {
      member_id: identity.id, member_name: identity.name, department: identity.department,
      report_date: todayStr(), task: isLeave ? (task.trim() || 'On Leave') : task.trim(),
      time_spent: isLeave ? null : (time ? parseFloat(time) : null), status, notes: notes.trim(),
      updated_at: new Date().toISOString()
    };
    if(proof_url) entry.proof_url = proof_url;

    const {error: sErr} = await sb.from('daily_reports').upsert(entry, {onConflict: 'member_id,report_date'});
    setSaving(false);
    if(sErr){ setError('Report save nahi ho paayi, dobara try karein.'); return; }
    setSaved(true);
    setTask(''); setTime(''); setNotes(''); setStatus('progress'); setFile(null);
    onSaved();
    setTimeout(()=>setSaved(false), 4000);
  }

  return (
    <div>
      <div className="page-title">Aaj ka Report</div>
      <p className="page-sub">{identity.name} · {identity.username} · {prettyDate(todayStr())}</p>
      <div className="dept-badge">🏷 {identity.department || 'Department set nahi hai'}</div>
      {saved && <div className="toast">Report save ho gayi — Admin ko dikh rahi hai.</div>}
      <div className="card">
        <form onSubmit={handleSubmit}>
          <label>Status</label>
          <div className="status-pills">
            <button type="button" className={"pill " + (status==='progress'?'sel-progress':'')} onClick={()=>setStatus('progress')}>In Progress</button>
            <button type="button" className={"pill " + (status==='done'?'sel-done':'')} onClick={()=>setStatus('done')}>Complete</button>
            <button type="button" className={"pill " + (status==='pending'?'sel-pending':'')} onClick={()=>setStatus('pending')}>Pending</button>
            <button type="button" className={"pill " + (status==='leave'?'sel-leave':'')} onClick={()=>setStatus('leave')}>🏖 Aaj Leave hoon</button>
          </div>

          {!isLeave && (
            <React.Fragment>
              <label>Aaj kya kaam kiya / kar rahe hain?</label>
              <textarea placeholder="jaise: Client follow-up calls kiye, 5 naye leads add kiye..." value={task} onChange={e=>setTask(e.target.value)}></textarea>
              <div className="row2">
                <div>
                  <label>Kitna time laga (ghante mein)</label>
                  <input type="number" step="0.5" min="0" placeholder="jaise 3.5" value={time} onChange={e=>setTime(e.target.value)} />
                </div>
                <div>
                  <label>Kaam ka Proof (photo, optional)</label>
                  <input type="file" accept="image/*" onChange={e=>setFile(e.target.files[0] || null)} />
                </div>
              </div>
            </React.Fragment>
          )}

          <label>Extra notes (optional)</label>
          <textarea placeholder="kuch aur batana ho to yahan likhein..." value={notes} onChange={e=>setNotes(e.target.value)}></textarea>
          {error && <div className="err">{error}</div>}
          <button className="btn" type="submit" disabled={saving}>{saving ? 'Save ho raha hai...' : (isLeave ? 'Leave Mark Karein' : 'Report Submit Karein')}</button>
        </form>
      </div>
    </div>
  );
}

function statusBadge(status){
  if(status==='done') return <span className="badge badge-done">Complete</span>;
  if(status==='pending') return <span className="badge badge-pending">Pending</span>;
  if(status==='leave') return <span className="badge badge-leave">On Leave</span>;
  return <span className="badge badge-progress">In Progress</span>;
}

function LiveClock(){
  const [now, setNow] = useState(new Date());
  useEffect(()=>{
    const t = setInterval(()=>setNow(new Date()), 1000);
    return ()=>clearInterval(t);
  }, []);
  const time = now.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const date = now.toLocaleDateString('en-IN', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});
  return (
    <div className="clock-box">
      <div className="clock-time">{time}</div>
      <div className="clock-date">{date}</div>
    </div>

function buildMonthGrid(year, monthIdx){
  const firstDay = new Date(year, monthIdx, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++){
    const iso = year + '-' + String(monthIdx+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    cells.push(iso);
  }
  return cells;
}

function ReportCalendar({identity, admin}){
  const [cursor, setCursor] = useState(()=>{
    const n = new Date();
    return {year: n.getFullYear(), month: n.getMonth()};
  });
  const [dayData, setDayData] = useState({});
  const [totalEmployees, setTotalEmployees] = useState(0);

  useEffect(()=>{
    let cancelled = false;
    async function load(){
      const monthStart = cursor.year + '-' + String(cursor.month+1).padStart(2,'0') + '-01';
      const nextMonth = cursor.month === 11 ? {y:cursor.year+1,m:0} : {y:cursor.year,m:cursor.month+1};
      const monthEnd = nextMonth.y + '-' + String(nextMonth.m+1).padStart(2,'0') + '-01';

      let query = sb.from('daily_reports').select('report_date, member_id').gte('report_date', monthStart).lt('report_date', monthEnd);
      if(!admin) query = query.eq('member_id', identity.id);
      const {data} = await query;

      const map = {};
      (data || []).forEach(r => {
        if(!map[r.report_date]) map[r.report_date] = new Set();
        map[r.report_date].add(r.member_id);
      });
      if(admin){
        const {data: emps} = await sb.from('activity_log_members').select('id');
        if(!cancelled) setTotalEmployees((emps || []).length);
      }
      if(!cancelled) setDayData(map);
    }
    load();
    return ()=>{cancelled=true;};
  }, [cursor, admin, identity]);

  const cells = buildMonthGrid(cursor.year, cursor.month);
  const monthLabel = new Date(cursor.year, cursor.month, 1).toLocaleDateString('en-IN', {month:'long', year:'numeric'});
  const todayIso = todayStr();
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function prevMonth(){
    setCursor(c => c.month === 0 ? {year:c.year-1, month:11} : {year:c.year, month:c.month-1});
  }
  function nextMonth(){
    setCursor(c => c.month === 11 ? {year:c.year+1, month:0} : {year:c.year, month:c.month+1});
  }

  return (
    <div>
      <div className="page-title">Calendar</div>
      <p className="page-sub">{admin ? 'Kis din kitne employees ne report di.' : 'Aapne kis din report submit ki.'}</p>
      <div className="cal-wrap">
        <div className="cal-head">
          <button className="cal-nav" onClick={prevMonth}>← Pichla</button>
          <h3>{monthLabel}</h3>
          <button className="cal-nav" onClick={nextMonth}>Agla →</button>
        </div>
        <div className="cal-grid">
          {dows.map(d => <div key={d} className="cal-dow">{d}</div>)}
          {cells.map((iso, i) => {
            if(!iso) return <div key={i} className="cal-cell empty"></div>;
            const dayNum = parseInt(iso.slice(-2), 10);
            const submittedSet = dayData[iso];
            const hasData = submittedSet && submittedSet.size > 0;
            const isToday = iso === todayIso;
            return (
              <div key={i} className={"cal-cell " + (hasData ? 'done ' : '') + (isToday ? 'today' : '')}>
                <div className="cal-daynum">{dayNum}</div>
                {hasData && <div className="cal-badge">{admin ? (submittedSet.size + '/' + totalEmployees) : '✓'}</div>}
              </div>
            );
          })}
        </div>
        <div className="cal-legend">
          <span><span className="cal-dot"></span>Report submit hui</span>
        </div>
      </div>
    </div>
  );
}

  return (

      <div className="bar-track"><div className="bar-fill" style={{width: pct + '%'}}></div></div>
      <div className="bar-value">{value}{unit}</div>
    </div>
  );
}

function ChartsView({refreshKey}){
  const [reports, setReports] = useState(null);
  const [employees, setEmployees] = useState([]);

  useEffect(()=>{
    let cancelled = false;
    Promise.all([
      sb.from('daily_reports').select('*'),
      sb.from('activity_log_members').select('*')
    ]).then(([r,e])=>{
      if(!cancelled){ setReports(r.data || []); setEmployees(e.data || []); }
    });
    return ()=>{cancelled=true;};
  }, [refreshKey]);

  const byEmployee = useMemo(()=>{
    if(!reports) return [];
    const map = {};
    reports.forEach(r => {
      if(!map[r.member_name]) map[r.member_name] = 0;
      map[r.member_name] += (r.time_spent || 0);
    });
    return Object.entries(map).map(([name, hours]) => ({name, hours: Math.round(hours*10)/10})).sort((a,b)=>b.hours-a.hours);
  }, [reports]);

  const byDept = useMemo(()=>{
    if(!reports) return [];
    const map = {};
    reports.forEach(r => {
      const key = r.department || 'Department set nahi hai';
      if(!map[key]) map[key] = 0;
      map[key] += (r.time_spent || 0);
    });
    return Object.entries(map).map(([dept, hours]) => ({dept, hours: Math.round(hours*10)/10})).sort((a,b)=>b.hours-a.hours);
  }, [reports]);

  const maxEmpHours = Math.max(1, ...byEmployee.map(e=>e.hours));
  const maxDeptHours = Math.max(1, ...byDept.map(d=>d.hours));

  return (
    <div>
      <div className="page-title">Charts</div>
      <p className="page-sub">Kaun kitna time de raha hai — employee aur department wise.</p>

      {reports === null ? (
        <div className="loading">Load ho raha hai...</div>
      ) : reports.length === 0 ? (
        <div className="table-wrap"><div className="empty-state"><div className="glyph">📈</div>Abhi tak koi report nahi hai, isliye chart khaali hai.</div></div>
      ) : (
        <React.Fragment>
          <div className="card chart-block">
            <h4>Employee-wise Total Ghante</h4>
            {byEmployee.map(e => <BarRow key={e.name} label={e.name} value={e.hours} max={maxEmpHours} unit=" hr" />)}
          </div>
          <div className="card chart-block">
            <h4>Department-wise Total Ghante</h4>
            {byDept.map(d => <BarRow key={d.dept} label={d.dept} value={d.hours} max={maxDeptHours} unit=" hr" />)}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function App(){
  const [identity, setIdentity] = useState(null);
  const [tab, setTab] = useState(null);
  const [refreshKey, setRefreshKey] = useState(0);

  function handleLogin(id){
    setIdentity(id);
    setTab(isAdminRole(id.role) ? 'admin-reports' : 'submit');
  }
  function handleLogout(){ setIdentity(null); }

  if(identity === null){
    return <LoginScreen onLogin={handleLogin} />;
  }

  const admin = isAdminRole(identity.role);

  return (
    <div className="app">
      <div className="sidebar">
        <div>
          <div className="sidebar-logo-row"><img src={LOGO_URI} className="sidebar-logo" alt="EVISION" /></div>
          <div className="brand">Team Activity <span>Log</span>
            <small>DAILY WORK TRACKER</small>
            <span className={"role-tag " + (admin ? 'role-admin' : 'role-emp')}>{admin ? 'ADMIN' : 'EMPLOYEE'}</span>
          </div>
          <LiveClock />
        </div>
        <div className="nav">
          {admin ? (
            <React.Fragment>
              <button className={tab==='admin-reports'?'active':''} onClick={()=>{setTab('admin-reports'); setRefreshKey(k=>k+1);}}>📊 Team Reports</button>
              <button className={tab==='calendar'?'active':''} onClick={()=>setTab('calendar')}>📅 Calendar</button>
              <button className={tab==='charts'?'active':''} onClick={()=>{setTab('charts'); setRefreshKey(k=>k+1);}}>📈 Charts</button>
              <button className={tab==='manage'?'active':''} onClick={()=>{setTab('manage'); setRefreshKey(k=>k+1);}}>👥 Employees Manage</button>
              <a href="https://indiaevision627-lgtm.github.io/evision-tender-tracker.html/" target="_blank" rel="noreferrer" style={{textDecoration:'none'}}>
                <button type="button">🗂 Tender Tracker ↗</button>
              </a>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <button className={tab==='submit'?'active':''} onClick={()=>setTab('submit')}>📝 Aaj ka Report</button>
              <button className={tab==='mine'?'active':''} onClick={()=>{setTab('mine'); setRefreshKey(k=>k+1);}}>🗂 Meri Reports</button>
              <button className={tab==='chat'?'active':''} onClick={()=>setTab('chat')}>💬 Team Chat</button>
              <button className={tab==='calendar'?'active':''} onClick={()=>setTab('calendar')}>📅 Calendar</button>
            </React.Fragment>
          )}
        </div>
        <div className="whoami">
          <b>{identity.name}</b>
          {identity.username}
          <button className="switch-link" onClick={handleLogout}>Logout</button>
        </div>
      </div>
      <div className="main">
        {admin && tab==='admin-reports' && <AdminReports refreshKey={refreshKey} />}
        {admin && tab==='manage' && <ManageEmployees refreshKey={refreshKey} onChanged={()=>setRefreshKey(k=>k+1)} />}
        {!admin && tab==='submit' && <SubmitReport identity={identity} onSaved={()=>setRefreshKey(k=>k+1)} />}
        {!admin && tab==='mine' && <MyReports identity={identity} refreshKey={refreshKey} />}
        {!admin && tab==='chat' && <TeamChat identity={identity} />}
        {admin && tab==='calendar' && <ReportCalendar identity={identity} admin={true} />}
        {admin && tab==='charts' && <ChartsView refreshKey={refreshKey} />}
        {!admin && tab==='calendar' && <ReportCalendar identity={identity} admin={false} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
